<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang web đơn giản</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f7fb;
      color: #1f2937;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      max-width: 720px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #111827;
    }

    p {
      margin-bottom: 16px;
      color: #4b5563;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      margin: 16px 0 24px;
    }

    li {
      background: #f3f4f6;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Xin chào! 👋</h1>
    <p>Đây là một trang web đơn giản được tạo nhanh theo yêu cầu của bạn.</p>
    <p>Bạn có thể chỉnh sửa nội dung để giới thiệu bản thân hoặc dự án:</p>
    <ul>
      <li>✅ Thông tin ngắn gọn, dễ đọc.</li>
      <li>✅ Thiết kế tối giản, tập trung nội dung.</li>
      <li>✅ Sẵn sàng mở rộng thêm mục mới.</li>
    </ul>
    <div class="actions">
      <button class="primary" type="button">Bắt đầu khám phá</button>
      <button class="secondary" type="button">Liên hệ</button>
    </div>
  </main>
</body>
</html>
